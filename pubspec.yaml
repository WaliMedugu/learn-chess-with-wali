name: learn_chess_with_wali
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  chess: ^0.8.1
  flutter_svg: ^2.2.3
  chess_vectors_flutter: ^1.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FAF6F0"
  adaptive_icon_foreground: "assets/logo_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/coach.png
    - assets/logo.png
    - assets/sounds/
    - assets/mbti_coaches/

  fonts:
    - family: Anthropic Serif
      fonts:
        - asset: assets/fonts/AnthropicSerif-Display-Regular-Static.otf
        - asset: assets/fonts/AnthropicSerif-Display-Medium-Static.otf
          weight: 500
        - asset: assets/fonts/AnthropicSerif-Display-Semibold-Static.otf
          weight: 600
        - asset: assets/fonts/AnthropicSerif-Display-Bold-Static.otf
          weight: 700
        - asset: assets/fonts/AnthropicSerif-Display-RegularItalic-Static.otf
          style: italic
        - asset: assets/fonts/AnthropicSerif-Display-BoldItalic-Static.otf
          weight: 700
          style: italic
        - asset: assets/fonts/AnthropicSerif-Text-Regular-Static.otf
        - asset: assets/fonts/AnthropicSerif-Text-Medium-Static.otf
          weight: 500
        - asset: assets/fonts/AnthropicSerif-Text-Semibold-Static.otf
          weight: 600
        - asset: assets/fonts/AnthropicSerif-Text-Bold-Static.otf
          weight: 700

    - family: Anthropic Sans
      fonts:
        - asset: assets/fonts/AnthropicSans-Text-Regular-Static.otf
        - asset: assets/fonts/AnthropicSans-Text-Medium-Static.otf
          weight: 500
        - asset: assets/fonts/AnthropicSans-Text-Semibold-Static.otf
          weight: 600
        - asset: assets/fonts/AnthropicSans-Text-Bold-Static.otf
          weight: 700
        - asset: assets/fonts/AnthropicSans-Text-RegularItalic-Static.otf
          style: italic
        - asset: assets/fonts/AnthropicSans-Text-MediumItalic-Static.otf
          weight: 500
          style: italic
        - asset: assets/fonts/AnthropicSans-Text-BoldItalic-Static.otf
          weight: 700
          style: italic
        - asset: assets/fonts/AnthropicSans-Display-Regular-Static.otf
        - asset: assets/fonts/AnthropicSans-Display-Bold-Static.otf
          weight: 700

    - family: Anthropic Mono
      fonts:
        - asset: assets/fonts/Anthropic Mono Web.otf
        - asset: assets/fonts/Anthropic Mono Web Regular Italic.otf
          style: italic
